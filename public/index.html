<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exchange rates</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #f6f6fa; color: #1b1d2e; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #101220; color: #ededf5; } }
  main { max-width: 34rem; }
  h1 { font-size: 1.35rem; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  a { color: #5b68c0; }
  code { background: rgba(127,127,127,.15); padding: 2px 6px; border-radius: 6px; }
</style>
<main>
  <h1>Exchange rates</h1>
  <p>European Central Bank reference rates, published as one file:
     <code><a href="rates.json">rates.json</a></code>, refreshed a few times
     a day.</p>
  <p>The ECB publishes once per business day; at weekends Friday's rates
     apply.</p>
  <p>Nothing but the request itself reaches this host.</p>
</main>
